name: Documentation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  push:
    branches:
      - main
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install markdownlint
        run: npm i -g markdownlint-cli

      - name: Lint documentation
        run: markdownlint --config docs/.markdownlint.json "docs/**/*.md"

      - name: Create GitHub App token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'npgsql/npgsql'
        id: docs-app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: npgsql
          repositories: doc

      - name: Trigger documentation build
        if: steps.docs-app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.docs-app-token.outputs.token }}
        run: gh api --method POST repos/npgsql/doc/dispatches -f event_type=docs-changed
